name: Auto-bump version

# Fires when a PR merges into master — not on every push — so this workflow's
# own version-bump commit can't retrigger itself (no pull_request event is
# created by a direct push). Bump type comes from the PR title's
# conventional-commit prefix: "feat:" -> minor, "type!:"/"BREAKING CHANGE" ->
# major, anything else -> patch. Pushing the bump to master then triggers the
# existing publish.yml, which watches for package.json changes.
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (for a manual/catch-up run)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Determine bump type
        id: bump-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=${{ toJSON(github.event.pull_request.title) }}
          if echo "$TITLE" | grep -qiE '^"[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$TITLE" | grep -qiE '^"feat(\([^)]*\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, commit, and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.bump-type.outputs.type }} -m "chore: bump version to %s"
          git push origin master --follow-tags
