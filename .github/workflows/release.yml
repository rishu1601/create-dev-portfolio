name: Release (bump + publish)

# Fires when a PR merges into master, or manually. Bump + build + publish
# all happen in ONE job — deliberately not split across two workflows
# chained by a push event, because a push made with the default
# GITHUB_TOKEN does not trigger other push-triggered workflows (GitHub's
# anti-loop protection). That gap is what silently broke the previous
# two-workflow (auto-bump.yml -> publish.yml) setup: the bump commit got
# pushed, but publish.yml never fired.
#
# Bump type comes from the PR title's conventional-commit prefix:
# "feat:" -> minor, "type!:"/"BREAKING CHANGE" -> major, else patch.
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (for a manual/catch-up run)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # trusted publishing needs Node >=22.14.0
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest # trusted publishing needs npm CLI >=11.5.1

      - name: Determine bump type
        id: bump-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=${{ toJSON(github.event.pull_request.title) }}
          if echo "$TITLE" | grep -qiE '^"[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$TITLE" | grep -qiE '^"feat(\([^)]*\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, commit, and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.bump-type.outputs.type }} -m "chore: bump version to %s"
          git push origin master --follow-tags

      - run: npm ci

      - run: npm run build

      - name: Publish
        run: npm publish
